[project]
name = "jev-ai"
version = "0.1.0"
description = "Backend de inteligencia comercial y automatización de marketing."
readme = "README.md"
authors = [
    { name = "SimplyVisio", email = "fran_chago@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.5",
    "httpx>=0.28",
    "langgraph>=1.2.21",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.16",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.importlinter]
root_package = "jev_ai"

[[tool.importlinter.contracts]]
name = "Modules no dependen de la capa de IA"
type = "forbidden"
source_modules = ["jev_ai.modules"]
forbidden_modules = ["jev_ai.ai"]

[[tool.importlinter.contracts]]
name = "La capa de IA puede usar los módulos de negocio"
type = "layers"
layers = [
  "jev_ai.ai",
  "jev_ai.modules",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
